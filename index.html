<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>《管理学原理》期末复习核心考点思维导图</title>
<style>
  :root {
    --bg-page: #f4f6fb;
    --bg-header: rgba(255, 255, 255, 0.94);
    --bg-card: #ffffff;
    --bg-card-hover: #f8fafc;
    --bg-verbatim: #f8f9fc;
    --bg-must: #fff5f5;
    --bg-star-card: #fffdf7;
    --text-primary: #1e293b;
    --text-secondary: #475569;
    --text-muted: #64748b;
    --text-verbatim: #334155;
    --border-light: #e2e8f0;
    --border-card: #cbd5e1;
    --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
    --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);

    /* Theme branch accents */
    --c-root: #1e293b;
    --c-root-bg: #1e293b;
    --c-root-text: #ffffff;

    --c-teal: #0d9488;
    --c-teal-soft: #ccfbf1;
    --c-teal-border: #5eead4;
    --c-teal-line: #14b8a6;

    --c-indigo: #4f46e5;
    --c-indigo-soft: #e0e7ff;
    --c-indigo-border: #a5b4fc;
    --c-indigo-line: #6366f1;

    --c-violet: #7c3aed;
    --c-violet-soft: #f3e8ff;
    --c-violet-border: #d8b4fe;
    --c-violet-line: #8b5cf6;

    /* Derivative / Marker Badges */
    --badge-star-bg: #fef3c7;
    --badge-star-text: #b45309;
    --badge-star-border: #f59e0b;

    --badge-must-bg: #fee2e2;
    --badge-must-text: #b91c1c;
    --badge-must-border: #ef4444;

    --badge-diff-bg: #ffedd5;
    --badge-diff-text: #c2410c;

    --badge-def-bg: #e0f2fe;
    --badge-def-text: #0369a1;

    --badge-list-bg: #dcfce7;
    --badge-list-text: #15803d;

    --badge-page-bg: #f1f5f9;
    --badge-page-text: #475569;

    --badge-orig-bg: #ede9fe;
    --badge-orig-text: #6d28d9;

    --btn-bg: #ffffff;
    --btn-text: #334155;
    --btn-border: #cbd5e1;
    --btn-active-bg: #2563eb;
    --btn-active-text: #ffffff;
    --btn-active-border: #2563eb;

    --toggle-bg: #ffffff;
    --toggle-border: #94a3b8;
    --toggle-text: #334155;
    --toggle-hover-bg: #eff6ff;

    --guide-line: #cbd5e1;
  }

  html[data-theme="dark"] {
    --bg-page: #0f172a;
    --bg-header: rgba(15, 23, 42, 0.94);
    --bg-card: #1e293b;
    --bg-card-hover: #263449;
    --bg-verbatim: #162032;
    --bg-must: #2d1a22;
    --bg-star-card: #252218;
    --text-primary: #f1f5f9;
    --text-secondary: #cbd5e1;
    --text-muted: #94a3b8;
    --text-verbatim: #dbeafe;
    --border-light: #334155;
    --border-card: #475569;
    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.35);
    --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.45);

    --c-root: #38bdf8;
    --c-root-bg: #0284c7;
    --c-root-text: #ffffff;

    --c-teal: #2dd4bf;
    --c-teal-soft: rgba(45, 212, 191, 0.16);
    --c-teal-border: #0d9488;
    --c-teal-line: #2dd4bf;

    --c-indigo: #818cf8;
    --c-indigo-soft: rgba(129, 140, 248, 0.18);
    --c-indigo-border: #4f46e5;
    --c-indigo-line: #818cf8;

    --c-violet: #c084fc;
    --c-violet-soft: rgba(192, 132, 252, 0.18);
    --c-violet-border: #7c3aed;
    --c-violet-line: #c084fc;

    --badge-star-bg: rgba(245, 158, 11, 0.2);
    --badge-star-text: #fbbf24;
    --badge-star-border: #d97706;

    --badge-must-bg: rgba(239, 68, 68, 0.22);
    --badge-must-text: #fca5a5;
    --badge-must-border: #ef4444;

    --badge-diff-bg: rgba(249, 115, 22, 0.2);
    --badge-diff-text: #fdba74;

    --badge-def-bg: rgba(14, 165, 233, 0.2);
    --badge-def-text: #7dd3fc;

    --badge-list-bg: rgba(34, 197, 94, 0.2);
    --badge-list-text: #86efac;

    --badge-page-bg: rgba(148, 163, 184, 0.2);
    --badge-page-text: #cbd5e1;

    --badge-orig-bg: rgba(139, 92, 246, 0.25);
    --badge-orig-text: #ddd6fe;

    --btn-bg: #1e293b;
    --btn-text: #e2e8f0;
    --btn-border: #475569;
    --btn-active-bg: #3b82f6;
    --btn-active-text: #ffffff;
    --btn-active-border: #3b82f6;

    --toggle-bg: #0f172a;
    --toggle-border: #64748b;
    --toggle-text: #f1f5f9;
    --toggle-hover-bg: #334155;

    --guide-line: #334155;
  }

  *, *::before, *::after {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    max-width: 100%;
    overflow-x: hidden;
    background-color: var(--bg-page);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* Sticky Top Toolbar */
  .top-header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bg-header);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border-light);
    box-shadow: var(--shadow-sm);
    padding: 10px 16px;
    width: 100%;
  }

  .header-inner {
    max-width: 100%;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px 12px;
  }

  .brand-area {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    min-width: 0;
  }

  .brand-title {
    font-size: 16px;
    font-weight: 700;
    margin: 0;
    color: var(--text-primary);
    letter-spacing: 0.2px;
  }

  .stats-pill {
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--badge-page-bg);
    color: var(--text-secondary);
    white-space: nowrap;
  }

  .controls-area {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
  }

  .mode-group, .view-group {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 5px;
  }

  .ctrl-divider {
    width: 1px;
    height: 22px;
    background: var(--border-light);
    margin: 0 2px;
  }

  .ctrl-btn {
    appearance: none;
    border: 1px solid var(--btn-border);
    background: var(--btn-bg);
    color: var(--btn-text);
    font-size: 12.5px;
    font-weight: 500;
    padding: 5px 10px;
    border-radius: 7px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s, transform 0.1s;
    line-height: 1.3;
    white-space: nowrap;
  }

  .ctrl-btn:hover:not(:disabled) {
    border-color: var(--btn-active-border);
  }

  .ctrl-btn:active:not(:disabled) {
    transform: translateY(1px);
  }

  .ctrl-btn.is-active {
    background: var(--btn-active-bg);
    color: var(--btn-active-text);
    border-color: var(--btn-active-border);
    font-weight: 600;
  }

  .ctrl-btn.star-mode-btn.is-active {
    background: #d97706;
    border-color: #d97706;
    color: #ffffff;
  }

  .ctrl-btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  /* Legend Bar */
  .legend-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 12px;
    padding: 7px 16px;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border-light);
    font-size: 12px;
    color: var(--text-secondary);
    width: 100%;
  }

  .legend-item {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  /* Badges */
  .badge {
    display: inline-flex;
    align-items: center;
    font-size: 10.5px;
    font-weight: 600;
    line-height: 1.2;
    padding: 1.5px 5px;
    border-radius: 4px;
    white-space: nowrap;
  }

  .badge-star {
    background: var(--badge-star-bg);
    color: var(--badge-star-text);
    border: 1px solid var(--badge-star-border);
  }

  .badge-must {
    background: var(--badge-must-bg);
    color: var(--badge-must-text);
    border: 1px solid var(--badge-must-border);
  }

  .badge-diff {
    background: var(--badge-diff-bg);
    color: var(--badge-diff-text);
  }

  .badge-def {
    background: var(--badge-def-bg);
    color: var(--badge-def-text);
  }

  .badge-list {
    background: var(--badge-list-bg);
    color: var(--badge-list-text);
  }

  .badge-page {
    background: var(--badge-page-bg);
    color: var(--badge-page-text);
  }

  .badge-orig {
    background: var(--badge-orig-bg);
    color: var(--badge-orig-text);
  }

  .badge-chapter {
    font-size: 10.5px;
    padding: 1.5px 6px;
    border-radius: 999px;
    font-weight: 600;
  }

  /* Main Workspace Container */
  .workspace {
    width: 100%;
    max-width: 100%;
    padding: 16px;
    overflow-x: hidden;
  }

  .mindmap-stage {
    position: relative;
    width: 100%;
    max-width: 100%;
  }

  .connector-svg {
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
    z-index: 0;
    overflow: visible;
  }

  .tree-root {
    position: relative;
    z-index: 1;
    width: 100%;
  }

  /* Shared Node Card Styling */
  .node-card {
    background: var(--bg-card);
    border: 1px solid var(--border-card);
    border-radius: 8px;
    padding: 7px 9px;
    box-shadow: var(--shadow-sm);
    transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
    word-break: break-word;
    overflow-wrap: anywhere;
    min-width: 0;
    cursor: pointer;
  }

  .node-card:hover {
    background: var(--bg-card-hover);
    box-shadow: var(--shadow-md);
  }

  .node-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
    margin-bottom: 3px;
  }

  .node-badges:empty {
    display: none;
  }

  .node-title {
    font-size: 12.5px;
    color: var(--text-primary);
    line-height: 1.42;
    white-space: pre-line;
  }

  /* Root card */
  .depth-0 > .node-col > .node-card {
    background: var(--c-root-bg);
    border-color: var(--c-root-bg);
    color: var(--c-root-text);
    padding: 11px 10px;
    text-align: center;
    box-shadow: var(--shadow-md);
  }

  .depth-0 > .node-col > .node-card .node-title {
    color: var(--c-root-text);
    font-size: 14px;
    font-weight: 700;
  }

  /* Chapter cards */
  .depth-1.theme-teal > .node-col > .node-card {
    background: var(--c-teal-soft);
    border: 1.5px solid var(--c-teal-border);
    border-left: 4px solid var(--c-teal);
  }
  .depth-1.theme-teal > .node-col > .node-card .badge-chapter {
    background: var(--c-teal);
    color: #fff;
  }

  .depth-1.theme-indigo > .node-col > .node-card {
    background: var(--c-indigo-soft);
    border: 1.5px solid var(--c-indigo-border);
    border-left: 4px solid var(--c-indigo);
  }
  .depth-1.theme-indigo > .node-col > .node-card .badge-chapter {
    background: var(--c-indigo);
    color: #fff;
  }

  .depth-1.theme-violet > .node-col > .node-card {
    background: var(--c-violet-soft);
    border: 1.5px solid var(--c-violet-border);
    border-left: 4px solid var(--c-violet);
  }
  .depth-1.theme-violet > .node-col > .node-card .badge-chapter {
    background: var(--c-violet);
    color: #fff;
  }

  .depth-1 > .node-col > .node-card .node-title {
    font-weight: 700;
    font-size: 13.5px;
  }

  /* Section cards */
  .depth-2.theme-teal > .node-col > .node-card {
    border-left: 3.5px solid var(--c-teal);
  }
  .depth-2.theme-indigo > .node-col > .node-card {
    border-left: 3.5px solid var(--c-indigo);
  }
  .depth-2.theme-violet > .node-col > .node-card {
    border-left: 3.5px solid var(--c-violet);
  }
  .depth-2 > .node-col > .node-card .node-title {
    font-weight: 600;
    font-size: 13px;
  }

  /* Star & ExamMust visual derivatives on framework nodes */
  .tree-branch.is-star-node[data-type="framework"] > .node-col > .node-card {
    background: var(--bg-star-card);
    border-color: var(--badge-star-border);
  }

  .tree-branch.is-must-node[data-type="framework"] > .node-col > .node-card,
  .tree-branch.is-must-node[data-type="section"] > .node-col > .node-card {
    background: var(--bg-must);
    border-color: var(--badge-must-border);
    border-left: 4px solid var(--badge-must-border);
  }

  /* Verbatim (PPT Original Text) leaf node styling */
  .tree-branch[data-type="verbatim"] > .node-col > .node-card {
    background: var(--bg-verbatim);
    border: 1px dashed var(--border-card);
    border-left: 3.5px solid #8b5cf6;
    cursor: default;
    padding: 8px 10px;
  }

  .tree-branch[data-type="verbatim"] > .node-col > .node-card .node-title {
    font-size: 12px;
    color: var(--text-verbatim);
    line-height: 1.52;
  }

  /* Collapse / Expand (− / +) Toggle Button */
  .toggle-btn {
    appearance: none;
    width: 20px;
    height: 20px;
    flex: 0 0 20px;
    border-radius: 50%;
    border: 1.5px solid var(--toggle-border);
    background: var(--toggle-bg);
    color: var(--toggle-text);
    font-size: 13px;
    font-weight: 700;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    user-select: none;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }

  .toggle-btn:hover {
    background: var(--toggle-hover-bg);
    border-color: var(--btn-active-border);
    color: var(--btn-active-border);
  }

  .tree-branch.theme-teal > .node-col > .toggle-btn {
    border-color: var(--c-teal);
    color: var(--c-teal);
  }
  .tree-branch.theme-indigo > .node-col > .toggle-btn {
    border-color: var(--c-indigo);
    color: var(--c-indigo);
  }
  .tree-branch.theme-violet > .node-col > .toggle-btn {
    border-color: var(--c-violet);
    color: var(--c-violet);
  }

  /* =========================================================
     VIEW 1: HORIZONTAL MINDMAP (.view-mindmap)
     ========================================================= */
  .view-mindmap .tree-branch {
    display: flex;
    flex-direction: row;
    align-items: center;
    min-width: 0;
  }

  .view-mindmap .node-col {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
    min-width: 0;
  }

  .view-mindmap .node-col > .node-card {
    flex: 1 1 auto;
    min-width: 0;
  }

  .view-mindmap .depth-0 > .node-col { width: var(--col-0, 110px); flex-basis: var(--col-0, 110px); }
  .view-mindmap .depth-1 > .node-col { width: var(--col-1, 150px); flex-basis: var(--col-1, 150px); }
  .view-mindmap .depth-2 > .node-col { width: var(--col-2, 180px); flex-basis: var(--col-2, 180px); }
  .view-mindmap .depth-3 > .node-col { width: var(--col-3, 220px); flex-basis: var(--col-3, 220px); }
  .view-mindmap .depth-4 > .node-col { width: var(--col-4, 260px); flex-basis: var(--col-4, 260px); }
  .view-mindmap .depth-5 > .node-col { width: var(--col-5, 340px); flex-basis: var(--col-5, 340px); }

  .view-mindmap .children-col {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 8px;
    padding-left: var(--gap-x, 24px);
    min-width: 0;
    flex: 1 1 auto;
  }

  .view-mindmap .depth-0 > .children-col {
    gap: 22px;
  }

  .view-mindmap .depth-1 > .children-col {
    gap: 14px;
  }

  /* =========================================================
     VIEW 2: VERTICAL OUTLINE (.view-outline)
     ========================================================= */
  .view-outline .connector-svg {
    display: none !important;
  }

  .view-outline .tree-branch {
    display: block;
    width: 100%;
    margin-bottom: 6px;
  }

  .view-outline .depth-1 {
    margin-top: 14px;
    margin-bottom: 14px;
  }

  .view-outline .node-col {
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    gap: 8px;
    width: 100% !important;
  }

  .view-outline .node-col > .toggle-btn {
    order: -1;
    margin-top: 7px;
  }

  .view-outline .tree-branch[data-type="verbatim"] > .node-col {
    padding-left: 28px;
  }

  .view-outline .node-col > .node-card {
    flex: 1 1 auto;
    width: auto;
  }

  .view-outline .depth-0 > .node-col > .node-card {
    text-align: left;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
  }

  .view-outline .depth-0 > .node-col > .node-card .node-title {
    white-space: normal;
    font-size: 16px;
  }

  .view-outline .children-col {
    display: block;
    margin-left: 10px;
    padding-left: 14px;
    margin-top: 6px;
    border-left: 2px solid var(--guide-line);
  }

  .view-outline .depth-1.theme-teal > .children-col { border-left-color: var(--c-teal-border); }
  .view-outline .depth-1.theme-indigo > .children-col { border-left-color: var(--c-indigo-border); }
  .view-outline .depth-1.theme-violet > .children-col { border-left-color: var(--c-violet-border); }

  /* =========================================================
     COLLAPSED & STAR-FILTERED STATES
     ========================================================= */
  .tree-branch.is-collapsed > .children-col {
    display: none !important;
  }

  .tree-branch.is-hidden-star {
    display: none !important;
  }

  /* Responsive Mobile Hint */
  .mobile-auto-hint {
    font-size: 11.5px;
    color: var(--text-muted);
    display: none;
  }

  @media (max-width: 759.98px) {
    .workspace {
      padding: 10px;
    }
    .ctrl-divider {
      display: none;
    }
    .mobile-auto-hint {
      display: inline;
    }
  }

  /* =========================================================
     PRINT MODE: AUTO EXPAND ALL & CLEAN FULL-WIDTH PRINT
     ========================================================= */
  @media print {
    html, body {
      background: #ffffff !important;
      color: #000000 !important;
      overflow: visible !important;
    }
    .top-header {
      position: static !important;
      box-shadow: none !important;
      border-bottom: 2px solid #000 !important;
    }
    .controls-area {
      display: none !important;
    }
    .connector-svg {
      display: none !important;
    }
    /* Automatically expand ALL nodes & show all branches when printing! */
    .tree-branch {
      display: block !important;
      width: 100% !important;
      margin-bottom: 5px !important;
      break-inside: avoid;
    }
    .tree-branch.is-hidden-star {
      display: block !important;
    }
    .tree-branch > .children-col,
    .tree-branch.is-collapsed > .children-col {
      display: block !important;
      margin-left: 10px !important;
      padding-left: 12px !important;
      margin-top: 5px !important;
      border-left: 1.5px solid #94a3b8 !important;
    }
    .node-col {
      display: flex !important;
      width: 100% !important;
      align-items: flex-start !important;
      gap: 6px !important;
    }
    .toggle-btn {
      display: none !important;
    }
    .node-card {
      box-shadow: none !important;
      width: 100% !important;
      break-inside: avoid;
    }
  }
</style>
</head>
<body>

<header class="top-header">
  <div class="header-inner">
    <div class="brand-area">
      <h1 class="brand-title">🧠 《管理学原理》期末核心考点思维导图</h1>
      <span class="stats-pill" id="statsPill">3章 · 16节 · 完整考点含原文</span>
      <span class="mobile-auto-hint">（手机窄屏已自动切换竖排大纲）</span>
    </div>

    <div class="controls-area">
      <div class="mode-group" role="group" aria-label="展开模式切换">
        <button type="button" class="ctrl-btn" data-mode="outline" id="btnModeOutline">只看大纲</button>
        <button type="button" class="ctrl-btn is-active" data-mode="framework" id="btnModeFramework">看完整框架</button>
        <button type="button" class="ctrl-btn" data-mode="all" id="btnModeAll">全部展开（含原文）</button>
